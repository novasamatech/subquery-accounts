# Run subql-node `test` against a single project YAML, in isolation from the
# main indexer stack (no graphql-engine, exits after the test completes).
#
# CI only: scripts/ci/run-tests.sh selects a unique project and cleans its DB.
# On Linux use make podman-all; do not install/build on the host.
#
# How it works:
#   subql-node walks every *.test.ts under src/, fetches the referenced block
#   via the RPC endpoint declared in the project YAML, runs the named handler,
#   and compares produced entities to `expectedEntities`.
#
# NOTE: dist/ must be built on the host before `up`, because the project dir
# is bind-mounted into the container (matches the pattern in docker-compose.yml).

services:
  postgres-test:
    build:
      context: .
      dockerfile: ./docker/pg-Dockerfile
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  subquery-node-test:
    image: subquerynetwork/subql-node-substrate:v6.4.6
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      DB_USER: postgres
      DB_PASS: postgres
      DB_DATABASE: postgres
      DB_HOST: postgres-test
      DB_PORT: 5432
    volumes:
      - ./:/app
    working_dir: /app
    restart: "no"
    command:
      - test
      - -f=/app/${PROJECT_PATH:-project-polkadot-asset-hub.yaml}
      - --db-schema=test
